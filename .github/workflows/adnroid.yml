name: Android CI, Stockfish ARM64 and APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build official Stockfish and APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out ChessMasterAI
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Run JVM unit tests (before the long native build)
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      - name: Build official Stockfish 19 for Android ARM64
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" STOCKFISH_JOBS=2 bash tools/build_stockfish_android.sh

      - name: Verify Stockfish ELF (ARM64, PIE)
        run: bash tools/verify_stockfish_binary.sh

      - name: Assemble debug APK with Stockfish
        run: gradle --no-daemon assembleDebug

      - name: Verify Stockfish is packaged in APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libstockfish.so'
          test -s app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Upload APK and engine provenance
        uses: actions/upload-artifact@v4
        with:
          name: ChessMasterAI-Stockfish19-ARM64-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            STOCKFISH_COMMIT.txt
            STOCKFISH_SOURCE_TAG.txt
            STOCKFISH_BINARY_SHA256.txt
            STOCKFISH_BINARY_INFO.txt
            STOCKFISH_LICENSE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
